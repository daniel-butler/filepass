[package]
name = "filepass"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/daniel-butler/filepass"

[lib]
name = "filepass"
path = "src/lib.rs"

[[bin]]
name = "filepass"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
humantime = "2"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
ipnet = "2"
nix = { version = "0.31", features = ["fs", "user"] }
thiserror = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["stream"] }
tempfile = "3"
